# PQ-from-genesis devnet for SEACAST on gossipsub: one Prysm and two Silver
# nodes, sixteen validators each. `kurtosis/run-seacast.sh` builds both images
# and runs it.
#
# `silver:seacast` is silver:pq-devnet-0's Dockerfile built with
# `--features silver/metrics,silver/seacast`. `prysm-beacon-chain:seacast-devnet`
# is ethpandaops/prysm-beacon-chain:pq-devnet-0 with the beacon-chain binary of
# Prysm's `seacast-devnet` branch.
#
# Prysm sends its envelopes as segments only, so a Silver node has a Prysm
# payload from gossip only through the segment topic.
#
# Silver is listed last: it opens its ports only at genesis, and Kurtosis
# starts consensus nodes in order, so nodes after it would start late.

participants:
  - el_type: geth
    cl_type: prysm
    cl_image: prysm-beacon-chain:seacast-devnet
    cl_extra_params:
      - --enable-segmented-payload-gossip
      - --seacast-uplink-mbps=1000
      - --seacast-payload-only
    vc_type: prysm
    vc_image: ethpandaops/prysm-validator:pq-devnet-0
    vc_extra_params:
      - --enable-beacon-rest-api
      - --vrf-state-url=https://raw.githubusercontent.com/ethpandaops/ethereum-package/d4c9a8ace9dd80ca4f9938885345f8f40a646fd0/static_files/xmss-keys/b9dec4e1daa17dfe.vrf
    use_separate_vc: true
    supernode: true
    validator_count: 16
  - el_type: geth
    cl_type: silver
    cl_image: silver:seacast
    vc_type: lighthouse
    vc_image: ethpandaops/lighthouse:pq-devnet-0
    validator_count: 16
    count: 2

network_params:
  preset: mainnet
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0
  pq_fork_epoch: 0
  num_validator_keys_per_node: 16
  attestation_subnet_count_pq: 2
  genesis_delay: 240
  xmss_cache_url: https://panda-uploads-production.devops-539.workers.dev/panda/uploads/dd1a1c/b9dec4e1daa17dfe.xmss

global_log_level: info
